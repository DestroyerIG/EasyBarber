services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/config/database.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/src/config/migration_v3.sql:/docker-entrypoint-initdb.d/02-migration-v3.sql
      - ./backend/src/config/migration_v4.sql:/docker-entrypoint-initdb.d/03-migration-v4.sql
      - ./backend/src/config/migration_v5.sql:/docker-entrypoint-initdb.d/04-migration-v5.sql
      - ./backend/src/config/migration_v6.sql:/docker-entrypoint-initdb.d/05-migration-v6.sql
      - ./backend/src/config/migration_v7.sql:/docker-entrypoint-initdb.d/06-migration-v7.sql
      - ./backend/src/config/migration_v8.sql:/docker-entrypoint-initdb.d/07-migration-v8.sql
      - ./backend/src/config/migration_v9.sql:/docker-entrypoint-initdb.d/08-migration-v9.sql
      - ./backend/src/config/migration_v10.sql:/docker-entrypoint-initdb.d/09-migration-v10.sql
      - ./backend/src/config/migration_v11.sql:/docker-entrypoint-initdb.d/10-migration-v11.sql
      - ./backend/src/config/migration_v12.sql:/docker-entrypoint-initdb.d/11-migration-v12.sql
      - ./backend/src/config/migration_v13.sql:/docker-entrypoint-initdb.d/12-migration-v13.sql
      - ./backend/src/config/migration_v14.sql:/docker-entrypoint-initdb.d/13-migration-v14.sql
      - ./backend/src/config/migration_v15.sql:/docker-entrypoint-initdb.d/14-migration-v15.sql
    environment:
      POSTGRES_DB: barberpro
      POSTGRES_USER: barberpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://barberpro:${DB_PASSWORD:-changeme}@db:5432/barberpro
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      LOG_LEVEL: info
      AUTH_PROVIDER_MODE: ${AUTH_PROVIDER_MODE:-dual}
      EMAIL_VERIFICATION_TTL_MINUTES: 60
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      AUTH_SUPABASE_REDIRECT_TO: ${AUTH_SUPABASE_REDIRECT_TO:-http://localhost:3000/auth/confirm}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-EasyBarber <no-reply@easybarber.local>}
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
